name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install python deps
        run: python -m pip install -r requirements.txt
      - name: build (unix)
        if: runner.os != 'Windows'
        run: ./build.sh
      - name: build (windows)
        if: runner.os == 'Windows'
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: openastralis-tools-${{ matrix.os }}
          path: build/openastralis-tools.jar
